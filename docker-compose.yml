# Local development for the chat UI. Builds the same image the server ships
# (from the repository root, so the image can copy the committed index,
# knowledge-base/index/kb_index.npz), but mounts the source and runs uvicorn
# with --reload so edits to main.py and static/index.html apply without a
# rebuild. The index lives at /index in the image, outside the mounted /app.
#
# Calls DO serverless inference outbound using MODEL_ACCESS_KEY from .env —
# no DO services run locally and nothing is exposed inbound. After editing
# documents, rebuild the index (the `index` service below), commit it, and
# rebuild the image: docker compose build chat-ui
services:
  chat-ui:
    build:
      context: .
      dockerfile: chat-ui/Dockerfile
      target: prod
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      # Falls back to a fixed dev value so an older .env without it still starts.
      HISTORY_SIGNING_KEY: ${HISTORY_SIGNING_KEY:-local-dev-signing-key}
    volumes:
      - ./chat-ui:/app
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8080 --reload

  # Runs the chat-ui test suite against the live source (mounted), using the dev
  # image (pytest installed). Not started by `docker compose up`; run it with:
  #   docker compose run --rm chat-ui-test
  chat-ui-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: chat-ui/Dockerfile
      target: dev
    volumes:
      - ./chat-ui:/app
    command: python -m pytest -v

  # Rebuilds the committed knowledge-base index from knowledge-base/data-sources/
  # with MODEL_ACCESS_KEY from .env. Run it after changing the documents (or the
  # chunking code) and commit knowledge-base/index/kb_index.npz with them; CI
  # fails a deploy whose index doesn't match the documents.
  #   docker compose --profile tools run --rm index
  # Check it without rebuilding (no API calls):
  #   docker compose --profile tools run --rm index python build_index.py --check --source /kb/data-sources --out /kb/index/kb_index.npz
  index:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: chat-ui/Dockerfile
      target: dev
    env_file:
      - ./.env
    volumes:
      - ./chat-ui:/app
      - ./knowledge-base:/kb
    command: python build_index.py --source /kb/data-sources --out /kb/index/kb_index.npz

  # Manual scraper: turns web pages into knowledge-base documents under
  # knowledge-base/data-sources/web/. Not started by `docker compose up`.
  #   docker compose run --rm scrape https://www.example.org/page/
  #   docker compose run --rm scrape --sitemap https://www.example.org/sitemap.xml
  #   docker compose run --rm scrape --html /input/page.htm --url https://www.example.org/page/
  # (for --html, put the saved page in tools/scrape/input/, which is gitignored)
  scrape:
    profiles: ["tools"]
    build:
      context: ./tools/scrape
    volumes:
      - ./tools/scrape:/app
      - ./tools/scrape/input:/input:ro
      - ./knowledge-base/data-sources/web:/out

  # Comparison against the old agent's saved answers (evals/compare.py). Uses the
  # dev image and needs the chat-ui service running:
  #   docker compose up -d chat-ui && docker compose run --rm evals python /evals/compare.py
  # Also runs the guardrail evals (evals/guardrails_eval.py), which call the
  # classifier directly with MODEL_ACCESS_KEY from .env (no chat-ui needed):
  #   docker compose run --rm evals python /evals/guardrails_eval.py [--case ID]
  evals:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: chat-ui/Dockerfile
      target: dev
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app:/evals
    volumes:
      - ./chat-ui:/app
      - ./evals:/evals
    command: python /evals/compare.py
